<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Prudhvi Kakkunuri</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card-bg: #0a0a0d;
      --primary: #ff6b00;
      --text: #f0f0f2;
      --text-dim: #8a8a93;
      --border: rgba(255, 255, 255, 0.08);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 60px 40px;
      max-width: 580px;
      width: 100%;
      border-radius: 4px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 6.5rem);
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 0 25px rgba(255, 107, 0, 0.3);
    }
    .error-badge {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    .error-desc {
      color: var(--text-dim);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: #000;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 14px 28px;
      text-decoration: none;
      letter-spacing: 1px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 107, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-badge">SYSTEM_COORDINATES // NOT_FOUND</div>
    <p class="error-desc">
      The requested route does not exist or has been relocated within the neural graph.
    </p>
    <a href="https://prudhvikakkunuri.github.io/" class="btn-home">
      RETURN TO PORTFOLIO &rarr;
    </a>
  </div>
</body>
</html>
